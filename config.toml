# The URL the site will be built for
base_url = "https://sudarsh.com"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = false

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

title = "Sudarsh Kunnavakkam"
description = "I'm Sudarsh! I think about physics and brains and alignment and my friends."

# SEO Configuration
taxonomies = [
    {name = "tags", feed = true},
    {name = "categories", feed = true}
]

[markdown]
# Whether to do syntax highlighting
# Theme can be customised by setting the `highlight_theme` variable to a theme supported by Zola
smart_punctuation = true

[markdown.highlighting]
theme = "one-light"
bottom_footnotes = true

[extra]
# Put all your custom variables here
generate_feeds = true
author = "Sudarsh Kunnavakkam"
feed_filenames = "atom.xml"

# Social media links for SEO
github = "skunnavakkam"
linkedin = "sudarshan-gopal-kunnavakkam"

# Additional SEO metadata
keywords = "sudarsh, physics, brains, bci, ultrasound, lasers, zebrafish, friends, ai, alignment"
og_image = "/static/profile.jpg"  # You'll need to add a profile image
twitter_card = "summary_large_image"